<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="turnstile-site-key" content="{{TURNSTILE_SITE_KEY}}">
<title>Transfer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234f46e5%22/%3E%3Cpath d=%22M16 7v13m-6-6 6 6 6-6M9 24h14%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css">
<script type="module" src="/assets/recipient.js"></script>
</head>
<body class="recv">
<header class="top"><span class="logo">Transfer</span></header>
<main>
  <section class="card wide" id="view">
    <div id="gate"><p class="status">Loading...</p><div id="turnstile"></div></div>
    <div id="content" hidden>
      <h1 id="tTitle"></h1>
      <p class="msg" id="tMsg"></p>
      <p class="sub" id="tMeta"></p>
      <a class="primary" id="zipBtn" href="#" download hidden>Download all</a>
      <ul class="files" id="tFiles"></ul>
    </div>
    <p class="status" id="err" hidden></p>
  </section>
</main>
<noscript><p class="status" style="text-align:center">Turn on JavaScript to see this transfer.</p></noscript>
</body>
</html>
